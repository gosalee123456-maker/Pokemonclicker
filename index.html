<!DOCTYPE html>
<html lang="ko">

<meta charset="UTF-8">

<title>Pokemon World Clicker 11.0</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #101426;
    color: white;
    font-family: Arial, sans-serif;
}

button {
    cursor: pointer;
    border: none;
    border-radius: 9px;
    padding: 11px;
    color: white;
    background: #536dfe;
    font-weight: bold;
    transition: .2s;
}

button:hover {
    filter: brightness(1.15);
}

button:disabled {
    opacity: .4;
    cursor: not-allowed;
}

header {
    background: #1c2440;
    padding: 13px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
}

.logo {
    font-size: 20px;
    font-weight: bold;
    color: #ffcb45;
}

.resources {
    display: flex;
    gap: 7px;
    flex-wrap: wrap;
}

.resource {
    background: #293454;
    padding: 9px 11px;
    border-radius: 9px;
    font-size: 13px;
}

nav {
    display: flex;
    overflow-x: auto;
    gap: 6px;
    padding: 10px;
    background: #171e35;
}

nav button {
    min-width: 85px;
    white-space: nowrap;
    background: #303b60;
}

nav button.active {
    background: #657cff;
}

main {
    max-width: 1250px;
    margin: auto;
    padding: 14px;
}

.panel {
    background: #1d2743;
    padding: 17px;
    border-radius: 14px;
    margin-bottom: 14px;
}

h2 {
    margin-top: 0;
    color: #ffcf59;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit,minmax(205px,1fr));
    gap: 11px;
}

.card {
    background: #293454;
    border-radius: 12px;
    padding: 13px;
    text-align: center;
}

.card img {
    width: 105px;
    height: 105px;
    object-fit: contain;
}

.card button {
    width: 100%;
    margin-top: 7px;
}

.card select {
    width: 100%;
    margin-top: 8px;
}

.item-image {
    width: 55px !important;
    height: 55px !important;
}

.click-area {
    text-align: center;
    padding: 25px 10px;
}

.main-pokemon {
    width: 220px;
    max-width: 60vw;
    cursor: pointer;
    filter: drop-shadow(0 0 18px #718aff);
    transition: .12s;
}

.main-pokemon:active {
    transform: scale(.86);
}

.click-button {
    display: block;
    margin: 17px auto;
    width: 230px;
    font-size: 20px;
    padding: 17px;
    background: linear-gradient(120deg,#536dfe,#9c55ff);
}

.tag {
    display: inline-block;
    background: #485b8d;
    border-radius: 20px;
    padding: 4px 9px;
    font-size: 11px;
    margin: 3px;
}

.price {
    color: #ffce54;
    font-weight: bold;
}

.gold {
    color: #ffda70;
}

.purple {
    color: #d59aff;
}

.muted {
    color: #aab4d0;
    font-size: 12px;
}

.progress {
    background: #111a30;
    height: 12px;
    border-radius: 20px;
    overflow: hidden;
    margin: 10px 0;
}

.progress div {
    height: 100%;
    background: linear-gradient(90deg,#536dfe,#d17aff);
}

input, select {
    background: #111a30;
    border: 1px solid #536dfe;
    padding: 11px;
    border-radius: 8px;
    color: white;
    margin: 4px;
    max-width: 100%;
}

hr {
    border-color: #394769;
    margin: 17px 0;
}

.float {
    position: fixed;
    pointer-events: none;
    color: #ffdb62;
    font-weight: bold;
    font-size: 21px;
    animation: pop .8s forwards;
    z-index: 100;
}

@keyframes pop {
    to {
        opacity: 0;
        transform: translateY(-90px) scale(1.4);
    }
}

footer {
    text-align: center;
    color: #8995b5;
    padding: 25px;
}

.danger-button {
    background: #d94355;
}

.secondary-button {
    background: #39496f;
}

@media (orientation: landscape) and (max-height: 600px) {

    header {
        padding: 7px 12px;
    }

    nav {
        padding: 6px;
    }

    main {
        max-width: 1500px;
    }

    .click-area {
        padding: 8px;
    }

    .main-pokemon {
        width: 140px;
    }

    .click-button {
        margin: 8px auto;
        padding: 11px;
    }

    .grid {

@media(max-width:600px) {

    header {

    }

        width: 165px;
    }

    .resources {

    }

    .grid {

    }

    .card {
        padding: 9px;
    }

    .card img {
        width: 85px;
        height: 85px;
    }

}

/* =====================================
   3. 기본 게임 데이터
===================================== */

function createOwned(count=1,level=1) {

    return {

        count,
        level,

        items:[],

        megaUnlocked:[],
        megaActive:"",

        gmaxUnlocked:false,
        gmaxActive:false

    };

}

function defaultGame() {

    return {

        coins:0,
        lifetime:0,

        clickLevel:0,
        autoLevel:0,
        globalLevel:0,

        gachaCount:0,
        pity:0,
        lastPulls:[],

        shards:0,

        transcend:0,
        cores:0,

        floor:0,
        riftDamage:0,
        fragments:0,

        infinityLevel:0,

        totalClicks:0,

            pikachu:createOwned(1)
        },

        dexSeen:{
            pikachu:true
        },

        itemBag:{},
        itemLevels:{},
        relics:{},

        lastSeen:Date.now()

    };

}


/* =====================================
   4. 저장 데이터 보정
===================================== */

function normalize(data) {

    const base=defaultGame();

    const result={
        ...base,
        ...(data||{})
    };

    result.owned=data?.owned || {};

    result.itemBag=data?.itemBag || {};
    result.itemLevels=data?.itemLevels || {};
    result.relics=data?.relics || {};

    result.dexSeen=data?.dexSeen || {};

    result.lastPulls=Array.isArray(data?.lastPulls)
        ?data.lastPulls:[ ];

    for(const id of Object.keys(result.owned)) {

        const own=result.owned[id];

        if(!PM[id] || !own) {

            delete result.owned[id];

            continue;

        }

        own.count=Math.max(
            0,
            Number(own.count)||0
        );

        own.level=Math.max(
            1,
            Number(own.level)||1
        );

        own.items=Array.isArray(own.items)
            ?own.items:[];

        own.megaUnlocked=Array.isArray(own.megaUnlocked)
            ?own.megaUnlocked:[];

        own.megaActive=own.megaActive||"";

        own.gmaxUnlocked=!!own.gmaxUnlocked;

        own.gmaxActive=!!own.gmaxActive;

        if(own.count<=0) {

            delete result.owned[id];

            continue;

        }

        result.dexSeen[id]=true;

    }

    // 시작 포켓몬 누락 오류 보정
    if(!result.owned.pikachu) {

        result.owned.pikachu=createOwned(1);

    }

    result.dexSeen.pikachu=true;

    return result;

}

function loadLocal() {

    try {

        const raw=localStorage.getItem(
            "pokemonWorldSave"
        );

        if(raw) {

            return normalize(JSON.parse(raw));

        }

    } catch(e) {

        console.error(e);

    }

    return defaultGame();

}

/* =====================================
   5. 경제 밸런스
===================================== */

// 포켓몬 자동 생산 수익 85% 감소
const PASSIVE_ECONOMY_RATE=.15;

function globalMultiplier() {

    const relicLevel=Object.values(game.relics)
        .reduce((a,b)=>a+b,0);

    return (

        1+

        game.globalLevel*.15+

        game.shards*.03+

        game.cores*.08+

        relicLevel*.10+

        game.infinityLevel*.10

    );

}

function clickValue() {

    return (

        .5+

        game.clickLevel*1.25

    )*globalMultiplier();

}

function pokemonBonus(p,own) {

    let bonus=0;

    for(const itemId of own.items||[]) {

        const item=ITEMS.find(
            x=>x.id===itemId
        );

        if(!item) continue;

        const lv=game.itemLevels[itemId]||0;

        bonus+=item.bonus+lv*item.gain;

        if(item.type===p.type) {

            bonus+=.25;

        }

    }

    return bonus;

}

function incomePerSecond() {

    let total=0;

    for(const id in game.owned) {

        const own=game.owned[id];

        const p=PM[id];

        if(!p) continue;

        let formMultiplier=1;

        if(own.megaActive) {

            formMultiplier=1.5;

        } else if(own.gmaxActive) {

            formMultiplier=1.75;

        }

        total+=

            own.count*

            p.income*

            PASSIVE_ECONOMY_RATE*

            (1+(own.level-1)*.18)*

            (1+pokemonBonus(p,own))*

            formMultiplier;

    }

    total*=globalMultiplier();

    total+=game.autoLevel*clickValue()*.15;

    return total;

}


/* =====================================
   6. 숫자 표시
===================================== */

function fmt(n) {

    if(!Number.isFinite(n)) {

        return "∞";

    }

    if(n<1000) {

        if(n<10 && !Number.isInteger(n)) {

            return n.toFixed(2);

        }

        return Math.floor(n).toLocaleString();

    }

    const units=[
        "K","M","B","T","Qa","Qi","Sx","Sp","Oc","No"
    ];

    let i=-1;

    while(n>=1000 && i<units.length-1) {

        n/=1000;
        i++;

    }

    if(n>=1000) {

        return n.toExponential(2);

    }

    return n.toFixed(2)+units[i];

}

function fmtPercent(n) {

    return (n*100).toFixed(3)+"%";

}

    if(!Number.isFinite(n)||n<=0) return;

    game.coins+=n;

    game.lifetime+=n;

function grantOffline() {

    const now=Date.now();

    const elapsed=Math.min(

        28800,

        Math.max(
            0,
            (now-(game.lastSeen||now))/1000
        )

    );

    const reward=
        incomePerSecond()*elapsed*.20;

    addCoins(reward);

    game.lastSeen=now;

    game.offlineReward=reward;

}

function saveGame() {

    game.lastSeen=Date.now();

    try {

        localStorage.setItem(

            "pokemonWorldSave",

            JSON.stringify(game)

        );

    } catch(e) {

        console.error("로컬 저장 실패",e);

    }

    if(user&&db) {

        clearTimeout(cloudTimer);

        cloudTimer=setTimeout(async()=>{

            try {

                const {doc,setDoc}=await import(

                    "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js"

                );

                await setDoc(

                    doc(db,"users",user.uid),

                    {

                        state:game,

                        updatedAt:Date.now()

                    }

                );

            } catch(e) {

                console.error("클라우드 저장 실패",e);

            }

        },1500);

    }

}

async function loadCloud(u) {

    try {

        const {doc,getDoc,setDoc}=await import(

            "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js"

        );

        const ref=doc(db,"users",u.uid);

        const snap=await getDoc(ref);

        if(snap.exists()&&snap.data().state) {

            game=normalize(snap.data().state);

            grantOffline();

        } else {

            await setDoc(ref,{

                state:game,

                updatedAt:Date.now()

            });

        }

        saveGame();

        render();

        setStatus("☁️ 클라우드 동기화 완료");

    } catch(e) {

        console.error(e);

        setStatus("클라우드 동기화 실패");

    }

}

// 희귀도별 확률 배율
// 전설은 환상보다 낮은 확률

const RARITY_WEIGHT={

    "일반":1,

    "희귀":.45,

    "에픽":.18,

    "환상":.012,

    "전설":.003

};

function getGachaWeight(p) {

    const base=p.weight??10;

    const multiplier=
        RARITY_WEIGHT[p.rarity]??.5;

    return base*multiplier;

}

function gachaCost(amount=1) {

    let total=0;

    const start=Math.min(
        game.gachaCount,
        200
    );

    for(let i=0;i<amount;i++) {

        total+=300*Math.pow(

            1.18,

            Math.min(start+i,200)

        );

    }

    return Math.ceil(total);

}

function randomPokemon() {

    let pool=GACHA_POOL;

    // 20회째 고등급 보장
    if(game.pity>=19) {

        pool=pool.filter(p=>

            ["에픽","환상","전설"].includes(
                p.rarity
            )

        );

    }

    if(!pool.length) {

        pool=GACHA_POOL;

    }

    const total=pool.reduce(

        (a,p)=>a+getGachaWeight(p),

        0

    );

    let roll=Math.random()*total;

    for(const p of pool) {

        roll-=getGachaWeight(p);

        if(roll<=0) {

            return p;

        }

    }

    return pool[0];

}

function gachaPull(amount=1) {

    const cost=gachaCost(amount);

    if(game.coins<cost) {

        alert("코인이 부족합니다!");

        return;

    }

    game.coins-=cost;

    const results=[];

    for(let i=0;i<amount;i++) {

        const p=randomPokemon();

        results.push(p.id);

        game.dexSeen[p.id]=true;

        if(

            ["에픽","환상","전설"].includes(
                p.rarity
            )

        ) {

            game.pity=0;

        } else {

            game.pity++;

        }

        if(!game.owned[p.id]) {

            game.owned[p.id]=createOwned(0);

        }

        game.owned[p.id].count++;

        game.gachaCount++;

    }

    game.lastPulls=results;

    saveGame();

    render();

}


/* =====================================
   11. 진화 시스템
===================================== */

// 1차 진화 Lv.20
// 2차 진화 Lv.40
// 리오르 Lv.30

function evolutionLevel(p) {

    if(p.id==="riolu") {

        return 30;

    }

    if(p.stage===1) {

        return 20;

    }

    if(p.stage===2) {

        return 40;

    }

    return 20;

}

function levelCost(id) {

    const p=PM[id];

    const own=game.owned[id];

    return Math.ceil(

        Math.max(50,p.income*15)*

        Math.pow(own.level,1.65)

    );

}

function levelPokemon(id) {

    const own=game.owned[id];

    const p=PM[id];

    if(!own||!p) return;

    const required=evolutionLevel(p);

    if(p.evo&&own.level>=required) {

        evolvePokemon(id);

        return;

    }

    const cost=levelCost(id);

    if(game.coins<cost) {

        alert("코인이 부족합니다!");

        return;

    }

    game.coins-=cost;

    own.level++;

    if(p.evo&&own.level>=required) {

        evolvePokemon(id);

        return;

    }

    saveGame();

    render();

}

function evolvePokemon(id) {

    const p=PM[id];

    const own=game.owned[id];

    if(!p||!p.evo||!own) return;

    const next=PM[p.evo];

    if(!next) return;

    if(own.count<=0) return;

    const evolvedCount=own.count;

    // 진화형이 없으면 새로 생성
    if(!game.owned[p.evo]) {

        game.owned[p.evo]=createOwned(
            0,
            own.level
        );

    }

    const target=game.owned[p.evo];

    // 기존 수량을 진화형으로 이동
    target.count+=evolvedCount;

    // 기존 레벨 승계
    target.level=Math.max(
        target.level,
        own.level
    );

    // 장착 도구 승계
    for(const item of own.items||[]) {

        if(target.items.length<2) {

            target.items.push(item);

        } else {

            game.itemBag[item]=
                (game.itemBag[item]||0)+1;

        }

    }

    // 기존 포켓몬 완전히 제거
    delete game.owned[id];

    // 도감에는 진화 기록 유지
    game.dexSeen[id]=true;

    game.dexSeen[p.evo]=true;

    saveGame();

    render();

    alert(

        "✨ 진화 완료!\n\n"+

        p.name+" → "+next.name+

        "\n\n보유 개체 "+evolvedCount+"마리 진화!"

    );

}

function itemUpgradeCost(id) {

    const item=ITEMS.find(x=>x.id===id);

    const lv=game.itemLevels[id]||0;

    return Math.ceil(

        item.price*Math.pow(2.2,lv)

    );

}

function upgradeItem(id) {

    const item=ITEMS.find(x=>x.id===id);

    if(!item) return;

    const cost=itemUpgradeCost(id);

    if(game.coins<cost) {

        alert("코인이 부족합니다!");

        return;

    }

    game.coins-=cost;

    game.itemLevels[id]=
        (game.itemLevels[id]||0)+1;

    saveGame();

    render();

}

function equipItem(pokemonId,itemId) {

    const own=game.owned[pokemonId];

    if(!own) return;

    if(!game.itemBag[itemId]) return;

    if(own.items.length>=2) {

        alert("포켓몬당 도구는 최대 2개입니다.");

        return;

    }

    own.items.push(itemId);

    game.itemBag[itemId]--;

    saveGame();

    render();

}

function unequipItem(pokemonId,itemId) {

    const own=game.owned[pokemonId];

    if(!own) return;

    own.items=own.items.filter(
        x=>x!==itemId
    );

    game.itemBag[itemId]=
        (game.itemBag[itemId]||0)+1;

    saveGame();

    render();

}


/* =====================================
   13. 메가진화 및 거다이맥스
===================================== */

function formCost(id,kind) {

    const own=game.owned[id];

    const count=kind==="mega"

        ?own.megaUnlocked.length

        :(own.gmaxUnlocked?1:0);

    const base=kind==="mega"
        ?50000
        :100000;

    return Math.ceil(
        base*Math.pow(2,count)
    );

}

function unlockMega(id,variant) {

    const p=PM[id];

    const own=game.owned[id];

    if(!p?.mega||!own) return;

    if(!p.mega.includes(variant)) return;

    if(own.megaUnlocked.includes(variant)) return;

    const cost=formCost(id,"mega");

    if(game.coins<cost) {

        alert("코인이 부족합니다!");

        return;

    }

    game.coins-=cost;

    own.megaUnlocked.push(variant);

    saveGame();

    render();

}

function toggleMega(id,variant) {

    const own=game.owned[id];

    if(!own) return;

    if(!own.megaUnlocked.includes(variant)) return;

    if(own.megaActive===variant) {

        own.megaActive="";

    } else {

        own.megaActive=variant;

        // 메가진화와 거다이맥스는 동시 적용 불가
        own.gmaxActive=false;

    }

    saveGame();

    render();

}

function unlockGmax(id) {

    const p=PM[id];

    const own=game.owned[id];

    if(!p?.gmax||!own) return;

    if(own.gmaxUnlocked) return;

    const cost=formCost(id,"gmax");

    if(game.coins<cost) {

        alert("코인이 부족합니다!");

        return;

    }

    game.coins-=cost;

    own.gmaxUnlocked=true;

    saveGame();

    render();

}

function toggleGmax(id) {

    const own=game.owned[id];

    if(!own||!own.gmaxUnlocked) return;

    own.gmaxActive=!own.gmaxActive;

    if(own.gmaxActive) {

        own.megaActive="";

    }

    saveGame();

    render();

}

   15. 환생
===================================== */

function rebirthRequirement() {

    return Math.floor(

        100000*Math.pow(
            1.8,
            game.rebirth
        )

    );

}

function rebirth() {

    const requirement=rebirthRequirement();

    if(game.coins<requirement) {

        alert("환생 조건을 달성하지 못했습니다.");

        return;

    }

    if(!confirm(

        "환생하시겠습니까?\n"+

        "포켓몬과 일반 코인이 초기화됩니다."

    )) return;

    const reward=Math.max(

        1,

        Math.floor(

            Math.sqrt(
                game.coins/requirement
            )*2

        )

    );

    game.shards+=reward;

    game.coins=0;

    game.owned={

        pikachu:createOwned(1)

    };

    game.itemBag={};

    game.clickLevel=0;

    game.autoLevel=0;

    game.globalLevel=0;

    game.gachaCount=0;

    game.pity=0;

    game.rebirth++;

    saveGame();

    render();

    alert(
        "⭐ 별의 조각 "+reward+"개 획득!"
    );

}

function transcend() {

    if(
        game.rebirth<10||
        game.lifetime<10000000
    ) {

        alert(
            "환생 10회 및 누적 코인 1천만이 필요합니다."
        );

        return;

    }

    if(!confirm("초월하시겠습니까?")) return;

    const reward=Math.max(

        1,

        Math.floor(
            Math.sqrt(game.shards/10)
        )

    );

    game.cores+=reward;

    game.coins=0;

    game.owned={

        pikachu:createOwned(1)

    };

    game.itemBag={};

    game.clickLevel=0;

    game.autoLevel=0;

    game.globalLevel=0;

    game.rebirth=0;

    game.shards=0;

    game.gachaCount=0;

    game.pity=0;

    game.transcend++;

    saveGame();

    render();

    alert(
        "🌌 차원의 핵 "+reward+"개 획득!"
    );

}

function gachaRate(rarity) {

    const total=GACHA_POOL.reduce(

        (a,p)=>a+getGachaWeight(p),

        0

    );

    const weight=GACHA_POOL.filter(

        p=>p.rarity===rarity

    ).reduce(

        (a,p)=>a+getGachaWeight(p),

        0

    );

    return total?weight/total:0;

}

            (own.gmaxActive?"거다이맥스":"");

/* =====================================
   31. 클릭 시스템
===================================== */

function doClick(event) {

    const now=Date.now();

    if(now-lastClick<700) {

        combo++;

    } else {

        combo=1;

    }

    lastClick=now;

    game.totalClicks++;

    let gain=clickValue();

    const critical=Math.random()<.08;

    if(critical) {

        gain*=5;

    }

    if(combo>=10) {

        gain*=1.5;

    }

    addCoins(gain);

    const float=document.createElement("div");

    float.className="float";

    float.textContent=

        (critical?"💥 CRITICAL! ":"+")+

        fmt(gain);

    float.style.left=

        (event.clientX||innerWidth/2)+"px";

    float.style.top=

        (event.clientY||innerHeight/2)+"px";

    document.body.appendChild(float);

    setTimeout(()=>float.remove(),800);

    updateHeader();

}


/* =====================================
   32. 이벤트 관리
===================================== */

document.addEventListener("click",async e=>{

    const nav=e.target.closest("[data-tab]");

    if(nav) {

        tab=nav.dataset.tab;

        render();

        return;

    }

    const btn=e.target.closest("[data-action]");

    if(!btn) return;

    const action=btn.dataset.action;

    const id=btn.dataset.id;

    const variant=btn.dataset.variant;

    switch(action) {

        case "mine":

            doClick(e);

            break;

        case "gacha1":

            gachaPull(1);

            break;

        case "gacha10":

            gachaPull(10);

            break;

        case "level":

            levelPokemon(id);

            break;

        case "buyItem":

            buyItem(id);

            break;

        case "upgradeItem":

            upgradeItem(id);

            break;

        case "equip": {

            const select=document.querySelector(

                `[data-equip-select="${id}"]`

            );

            if(select&&select.value) {

                equipItem(id,select.value);

            }

            break;

        }

        case "unequip":

            unequipItem(id,btn.dataset.item);

            break;

        case "upgrade":

            upgradeBasic(id);

            break;

        case "unlockMega":

            unlockMega(id,variant);

            break;

        case "toggleMega":

            toggleMega(id,variant);

            break;

        case "unlockGmax":

            unlockGmax(id);

            break;

        case "toggleGmax":

            toggleGmax(id);

            break;

        case "rebirth":

            rebirth();

            break;

        case "transcend":

            transcend();

            break;

        case "attack":

            attackRift();

            break;

        case "relic":

            buyRelic(id);

            break;

        case "infinity":

            upgradeInfinity();

            break;

        case "google":

            await googleLogin();

            break;

        case "emailLogin":

            await emailLogin(false);

            break;

        case "emailCreate":

            await emailLogin(true);

            break;

        case "logout":

            await logout();

            break;

        case "saveNow":

            saveGame();

            alert("게임이 저장되었습니다.");

            break;

        case "resetGame":

            resetGame();

            break;

    }

});


/* =====================================
   33. 자동 생산
===================================== */

setInterval(()=>{

    const income=incomePerSecond();

    if(income>0) {

        addCoins(income);

    }

    updateHeader();

    document.querySelectorAll(".live-income").forEach(el=>{

        el.textContent=fmt(income);

    });

},1000);


/* =====================================
   34. 자동 저장
===================================== */

setInterval(saveGame,5000);


/* =====================================
   35. 게임 시작
===================================== */

grantOffline();

render();

saveGame();

initFirebase();

</script>

</body>
</html>
